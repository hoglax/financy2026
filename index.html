<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый_отчет_2026 - Google Таблицы</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Roboto, Arial, sans-serif; font-size: 13px; background: #fff; color: #333; overflow: hidden; height: 100vh; }

    /* Интерфейс с синими акцентами */
    .header { background: #f9fbfd; border-bottom: 1px solid #e0e0e0; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
    .logo { width: 30px; height: 30px; background: #1a73e8; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .title-area { display: flex; flex-direction: column; }
    .doc-title { font-size: 18px; font-weight: normal; color: #202124; }
    .menu-bar { display: flex; gap: 12px; font-size: 12px; color: #5f6368; margin-top: 4px; }
    
    .toolbar { background: #edf2fa; height: 38px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 16px; gap: 8px; color: #444746; }
    .formula-bar { height: 28px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 8px; gap: 8px; background: #fff; color: #707070; }
    .fx { font-weight: bold; font-style: italic; color: #1a73e8; }
    .cell-input { border: none; outline: none; width: 100%; font-size: 13px; }

    /* Таблица */
    .grid-container { display: grid; grid-template-columns: 40px repeat(10, 100px); overflow: auto; height: calc(100vh - 105px); background: #f8f9fa; }
    .cell { border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; height: 25px; display: flex; align-items: center; justify-content: center; background: #fff; }
    .header-cell { background: #f8f9fa; color: #707070; font-weight: 500; }
    
    /* Синяя выделенная ячейка */
    .selected { outline: 2px solid #1a73e8; background-color: #e8f0fe; z-index: 1; }

    /* Помехи и Неоново-Синий экран */
    #glitch-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #03071e;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #4cc9f0;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 15px #4cc9f0, 0 0 30px #48cae4;
      gap: 20px;
    }

    /* Фото Шуфутинского с эффектом глитча */
    .shufutinsky-img {
      max-width: 300px; /* Увеличил размер фото */
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 20px #4cc9f0, 0 0 40px #0077b6;
      animation: glitch-img 0.2s infinite;
      border: 2px solid #4cc9f0;
    }

    .glitch-text {
      font-size: 70px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      animation: glitch 0.15s infinite, pulse 1.5s infinite alternate;
      text-align: center;
    }

    .noise-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.2;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, #000, #000 2px, #0077b6 2px, #0077b6 4px);
      animation: noise 0.05s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-4px, 2px); text-shadow: 3px 0 #f72585, -3px 0 #4cc9f0; }
      40% { transform: translate(-2px, -3px); }
      60% { transform: translate(3px, 1px); text-shadow: -3px 0 #f72585, 3px 0 #4cc9f0; }
      80% { transform: translate(1px, -2px); }
      100% { transform: translate(0); }
    }

    @keyframes glitch-img {
      0% { transform: translate(0) scale(1); filter: hue-rotate(0deg); }
      25% { transform: translate(-3px, 2px) scale(1.02); filter: hue-rotate(90deg); }
      50% { transform: translate(2px, -2px) scale(0.98); }
      75% { transform: translate(-1px, -1px) scale(1.01); filter: hue-rotate(-90deg); }
      100% { transform: translate(0) scale(1); filter: hue-rotate(0deg); }
    }

    @keyframes noise {
      0% { background-position: 0 0; }
      100% { background-position: 100px 100px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">田</div>
    <div class="title-area">
      <div class="doc-title">Отчет_3_сентября</div>
      <div class="menu-bar">
        <span>Файл</span><span>Правка</span><span>Вид</span><span>Вставка</span><span>Формат</span>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <span>↺</span> <span>↳</span> <span>🖨</span> <span>100%</span> <span>₽</span>
  </div>

  <div class="formula-bar">
    <span class="fx">fx</span>
    <input type="text" class="cell-input" value="Я календарь переверну...">
  </div>

  <div class="grid-container" id="grid"></div>

  <div id="glitch-overlay">
    <div class="noise-bg"></div>
    <img src="http://i.pinimg.com/originals/79/31/fb/7931fb8deebf51b221f8dbe8ff0126c8.jpg" alt="Михаил Шуфутинский" class="shufutinsky-img">
    <div class="glitch-text">3 СЕНТЯБРЯ</div>
  </div>

  <audio id="shufutinsky-audio" src="https://moria.101.ru/v1_1/mp3/46/stream_200021.mp3" preload="auto"></audio>

  <script>
    // Генерация таблицы
    const grid = document.getElementById('grid');
    const cols = ['', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    
    cols.forEach(c => {
      const cell = document.createElement('div');
      cell.className = 'cell header-cell';
      cell.innerText = c;
      grid.appendChild(cell);
    });

    for (let r = 1; r <= 25; r++) {
      const rowHeader = document.createElement('div');
      rowHeader.className = 'cell header-cell';
      rowHeader.innerText = r;
      grid.appendChild(rowHeader);

      for (let c = 1; c <= 8; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (r === 3 && c === 2) {
          cell.innerText = '03.09';
          cell.classList.add('selected');
        }
        grid.appendChild(cell);
      }
    }

    // Включение эффектов через 3 секунды
    setTimeout(() => {
      document.getElementById('glitch-overlay').style.display = 'flex';
      
      const audio = document.getElementById('shufutinsky-audio');
      audio.play().catch(() => {
        console.log("Автовоспроизведение заблокировано браузером. Требуется клик по странице.");
      });
    }, 3000);
  </script>
</body>
</html>
